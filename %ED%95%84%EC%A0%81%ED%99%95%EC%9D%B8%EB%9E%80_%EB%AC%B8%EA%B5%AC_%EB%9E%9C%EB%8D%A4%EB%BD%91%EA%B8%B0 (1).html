<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eef2ff">
<title>필적확인란 문구 랜덤 뽑기</title>
<style>
:root{--ink:#1b2442;--muted:#6e7899;--blue:#6279e8;--line:#dfe6ff;--paper:#fff;--bg:#f7f8ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#edf1ff 0,transparent 42%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
main{width:min(920px,calc(100% - 28px));margin:0 auto;padding:42px 0 34px}
.hero{text-align:center;padding:12px 10px 30px}
.logo{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,#7c91ff,#5d72dd);display:grid;place-items:center;color:white;font-size:29px;margin:0 auto 18px;box-shadow:0 9px 24px #6d80e833}
h1{font-size:clamp(27px,5vw,43px);line-height:1.22;letter-spacing:-1.5px;margin:0;font-weight:850}
h1 span{color:var(--blue)}
.lead{font-size:16px;color:#485374;margin:16px 0 7px}
.sublead{font-size:14px;color:#8892b1;margin:0}
button{font:inherit;cursor:pointer}
.draw{margin-top:27px;border:0;border-radius:17px;padding:17px 28px;background:linear-gradient(110deg,#6f83ee,#5d72df);color:white;font-size:19px;font-weight:750;box-shadow:0 8px 18px #6175df30;min-width:250px;transition:transform .15s,filter .15s}
.draw:hover{filter:brightness(1.04);transform:translateY(-1px)}
.draw:active{transform:translateY(1px)}
.panel{background:#ffffffd9;border:1px solid var(--line);border-radius:23px;padding:25px 24px 22px;box-shadow:0 12px 34px #293b7410}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h2{font-size:20px;margin:0;letter-spacing:-.5px}
.counter{font-size:12px;color:#7d87a8;background:#f0f3ff;padding:7px 10px;border-radius:999px;white-space:nowrap}
.cards{display:grid;gap:13px}
.quote-card{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:17px;border:1px solid #dce7ff;border-radius:17px;padding:19px;background:linear-gradient(110deg,#f5faff,#fff);min-height:116px}
.quote-card:nth-child(2){border-color:#e2dcff;background:linear-gradient(110deg,#f8f5ff,#fff)}
.quote-card:nth-child(3){border-color:#d5f0e7;background:linear-gradient(110deg,#f2fbf7,#fff)}
.num{width:44px;height:44px;border-radius:50%;background:#e2ebff;color:#526de0;font-size:20px;font-weight:800;display:grid;place-items:center}
.quote-card:nth-child(2) .num{background:#e9e3ff;color:#7462d8}
.quote-card:nth-child(3) .num{background:#d9f2e9;color:#338d75}
.quote{font-size:clamp(17px,2.6vw,22px);font-weight:700;line-height:1.55;word-break:keep-all}
.source{font-size:13px;color:#7b86a8;margin-top:7px}
.meta{background:#eef3ff;border-radius:12px;padding:12px 13px;text-align:center;min-width:132px}
.quote-card:nth-child(2) .meta{background:#f0edff}
.quote-card:nth-child(3) .meta{background:#eaf7f2}
.date{font-weight:750;font-size:14px;white-space:nowrap}
.kind{font-size:11px;color:#7b86a8;margin-top:5px;line-height:1.4}
.tools{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.small-btn{border:1px solid #e1e6fa;background:#fff;color:#59658c;border-radius:11px;padding:9px 12px;font-size:13px}
.small-btn:hover{background:#f4f6ff}
.note{margin-top:20px;border:1px solid #e5eaff;background:#f8f9ff;border-radius:13px;padding:13px 15px;color:#7b86a8;font-size:12px;line-height:1.7}
footer{text-align:center;color:#a0a8c0;font-size:12px;margin:20px 0 0}
@media(max-width:640px){main{padding-top:22px}.panel{padding:17px 13px}.panel-head{align-items:flex-start}.quote-card{grid-template-columns:38px minmax(0,1fr);gap:12px;padding:15px;position:relative}.num{width:36px;height:36px;font-size:17px}.meta{grid-column:2;display:flex;gap:8px;align-items:center;text-align:left;min-width:0;width:max-content;max-width:100%;padding:7px 10px}.kind{margin:0}.date{font-size:12px}.quote{font-size:17px}.source{font-size:12px}.draw{width:100%;min-width:0}.tools{justify-content:stretch}.small-btn{flex:1}}
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="logo" aria-hidden="true">✎</div>
    <h1>필적확인란 문구 <span>랜덤 뽑기</span></h1>
    <p class="lead">수능·모의고사 필적확인 문구 중에서 오늘 쓸 3가지를 골라드려요.</p>
    <p class="sublead">하루 세 문장, 천천히 또박또박 써 봐요 ✨</p>
    <button class="draw" id="drawButton">⤨　다시 뽑기</button>
  </header>
  <section class="panel" aria-live="polite">
    <div class="panel-head">
      <h2>✦ 오늘의 필적확인란 문구 3가지</h2>
      <span class="counter" id="counter">문구 목록 불러오는 중</span>
    </div>
    <div class="cards" id="cards"></div>
    <div class="tools">
      <button class="small-btn" id="copyButton">문구 3개 복사</button>
      <button class="small-btn" id="historyButton">다른 조합 보기</button>
    </div>
    <div class="note">
      <strong>안내</strong><br>
      • 사용자가 제공한 역대 필적확인란 문구 자료를 바탕으로 만들었어요.<br>
      • 자료에 기록된 연도·월과 시험 구분을 함께 표시해요. 원자료의 오기나 누락이 있을 수 있어요.<br>
      • 같은 문장이 다른 시험에서 다시 쓰인 경우, 출제 시기별로 각각 포함될 수 있어요.
    </div>
  </section>
  <footer>오늘도 좋은 문장과 함께 ☁️</footer>
</main>
<script>
const entries = [{"year": 2005, "month": "6월", "date": "2005년 6월", "kind": "평가원 모의평가", "quote": "하늘을 우러러 한 점 부끄럼이 없기를", "source": "윤동주, 〈서시〉"}, {"year": 2005, "month": "9월", "date": "2005년 9월", "kind": "평가원 모의평가", "quote": "산에는 꽃 피네 꽃이 피네 갈 봄 여름 없이", "source": "김소월, 〈산유화〉"}, {"year": 2005, "month": "수능", "date": "2005학년도 수능", "kind": "평가원 모의평가", "quote": "흙에서 자란 내마음 파란 하늘빛", "source": "정지용, 〈향수〉"}, {"year": 2006, "month": "3월", "date": "2006년 3월", "kind": "교육청 학력평가 · 고1·고2·고3", "quote": "산은 시들지 않는 영원한 품 속이다", "source": "법정, 〈홀로 있는 시간〉"}, {"year": 2006, "month": "4월", "date": "2006년 4월", "kind": "교육청 학력평가 · 고3", "quote": "파랑새는 항상 자기 마음속에 있다", "source": ""}, {"year": 2006, "month": "6월", "date": "2006년 6월", "kind": "교육청 학력평가 · 고1·고2", "quote": "세상의 중심엔 내 꿈이 있다", "source": ""}, {"year": 2006, "month": "6월", "date": "2006년 6월", "kind": "평가원 모의평가", "quote": "언제나 점잖은 편 말이 없구나", "source": "노천명, 〈사슴〉"}, {"year": 2006, "month": "9월", "date": "2006년 9월", "kind": "교육청 학력평가 · 고1·고2", "quote": "맑은 기운 서린 푸른 산봉우리", "source": ""}, {"year": 2006, "month": "9월", "date": "2006년 9월", "kind": "평가원 모의평가", "quote": "사뿐히 즈려 밟고 가시옵소서", "source": "김소월, 〈진달래꽃〉"}, {"year": 2006, "month": "10월", "date": "2006년 10월", "kind": "교육청 학력평가 · 고3", "quote": "해맑은 밤 바람이 이마에 내리는 여울가 모래밭", "source": "김광균, 〈성호 부근〉"}, {"year": 2006, "month": "수능", "date": "2006학년도 수능", "kind": "평가원 모의평가", "quote": "넓은 벌 동쪽 끝으로 옛이야기", "source": "정지용, 〈향수〉"}, {"year": 2006, "month": "11월", "date": "2006년 11월", "kind": "교육청 학력평가 · 고1·고2", "quote": "그 곳이 차마 꿈엔들 잊힐리야", "source": "정지용, 〈향수〉"}, {"year": 2007, "month": "3월", "date": "2007년 3월", "kind": "교육청 학력평가 · 고1·고2·고3", "quote": "붉은 파밭의 푸른 새싹을 보아라", "source": "김수영, 〈파밭가에서〉"}, {"year": 2007, "month": "4월", "date": "2007년 4월", "kind": "교육청 학력평가 · 고3", "quote": "그대 가슴 속에 꿈이 없다면 슬퍼하라", "source": ""}, {"year": 2007, "month": "6월", "date": "2007년 6월", "kind": "교육청 학력평가 · 고1·고2", "quote": "여유를 가지고 마음을 열어라", "source": ""}, {"year": 2007, "month": "6월", "date": "2007년 6월", "kind": "평가원 let lastIds = [];
function pickThree(){
  if(entries.length < 3) return entries.slice();
  const pool = entries.map((_,i)=>i);
  // Avoid repeating the exact previous trio where possible.
  let chosen = [];
  for(let attempt=0; attempt<20; attempt++){
    const shuffled = pool.slice().sort(()=>Math.random()-.5);
    chosen = shuffled.slice(0,3);
    if(chosen.slice().sort((a,b)=>a-b).join(",") !== lastIds.slice().sort((a,b)=>a-b).join(",")) break;
  }
  lastIds = chosen;
  return chosen.map(i=>entries[i]);
}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function draw(){
  const chosen=pickThree();
  document.getElementById("cards").innerHTML=chosen.map((e,i)=>`
    <article class="quote-card">
      <div class="num">${i+1}</div>
      <div>
        <div class="quote">“${escapeHtml(e.quote)}”</div>
        ${e.source?`<div class="source">${escapeHtml(e.source)}</div>`:""}
      </div>
      <div class="meta">
        <div class="date">${escapeHtml(e.date)}</div>
        <div class="kind">${escapeHtml(e.kind)}</div>
      </div>
    </article>`).join("");
  document.getElementById("counter").textContent=`총 ${entries.length}개 문구에서 선택`;
}
document.getElementById("drawButton").addEventListener("click",draw);
document.getElementById("historyButton").addEventListener("click",draw);
document.getElementById("copyButton").addEventListener("click",async()=>{
  const cards=[...document.querySelectorAll(".quote-card")];
  const output=cards.map((c,i)=>`${i+1}. ${c.querySelector(".quote").textContent.replace(/[“”]/g,"")}\n   ${c.querySelector(".date").textContent} · ${c.querySelector(".kind").textContent}`).join("\n\n");
  const btn=document.getElementById("copyButton");
  try{await navigator.clipboard.writeText(output);btn.textContent="복사 완료 ✓";setTimeout(()=>btn.textContent="문구 3개 복사",1500);}
  catch(e){const ta=document.createElement("textarea");ta.value=output;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();btn.textContent="복사 완료 ✓";setTimeout(()=>btn.textContent="문구 3개 복사",1500);}
});
draw();
</script>
